name: Check M!LK Updates

on:
  schedule:
    # 12分おき
    - cron: "*/12 * * * *"

  # GitHub上から手動実行も可能
  workflow_dispatch:

jobs:
  check-updates:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ----------------------------------------
      # リポジトリ取得
      # ----------------------------------------

      - name: リポジトリのコードを取得
        uses: actions/checkout@v4

      # ----------------------------------------
      # Python
      # ----------------------------------------

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ----------------------------------------
      # Go
      # tiktok-cli用
      # ----------------------------------------

      - name: Goのセットアップ
        uses: actions/setup-go@v6
        with:
          go-version: "stable"

      # ----------------------------------------
      # Pythonライブラリ
      # ----------------------------------------

      - name: Pythonライブラリのインストール
        run: |
          pip install -r requirements.txt

      # ----------------------------------------
      # tiktok-cli
      # ----------------------------------------

      - name: tiktok-cliのインストール
        run: |
          go install github.com/tamnd/tiktok-cli/cmd/tt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ----------------------------------------
      # M!LK監視
      # ----------------------------------------

      - name: M!LK更新チェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

      # ----------------------------------------
      # last_seen.json保存
      # ----------------------------------------

      - name: last_seen.jsonを保存
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add last_seen.json

          git diff --quiet && git diff --staged --quiet || (
            git commit -m "Update last_seen.json [skip ci]" &&
            git pull --rebase origin main &&
            git push origin main
          )
